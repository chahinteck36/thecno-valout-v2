    <!-- Dynamic Self-Referencing Canonical Tag & OpenGraph URL -->
    <script>
      (function() {
        var cleanUrl = window.location.origin + window.location.pathname;
        var canonical = document.querySelector("link[rel='canonical']");
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.setAttribute('rel', 'canonical');
          document.head.appendChild(canonical);
        }
        canonical.setAttribute('href', cleanUrl);

        var ogUrl = document.querySelector("meta[property='og:url']");
        if (!ogUrl) {
          ogUrl = document.createElement('meta');
          ogUrl.setAttribute('property', 'og:url');
          document.head.appendChild(ogUrl);
        }
        ogUrl.setAttribute('content', cleanUrl);
      })();
    </script>

    <!-- Deferred AdSense to prevent render-blocking and main-thread freezing -->
    <script>
      (function() {
        function loadAdSense() {
          var s = document.createElement('script');
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9787537851833974";
          s.crossOrigin = "anonymous";
          s.async = true;
          document.head.appendChild(s);
        }
        if (window.requestIdleCallback) {
          window.requestIdleCallback(loadAdSense);
        } else {
          window.addEventListener('load', loadAdSense);
        }
      })();
    </script>
